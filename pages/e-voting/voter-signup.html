<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voter signup — E-Voting</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="page">
    <a class="back-link" href="/pages/e-voting/type.html">← Back</a>
    <h2>Voter signup</h2>
    <label>Election ID *</label>
    <input id="credential" />
    <label>Full name *</label>
    <input id="fullName" />
    <label>Phone *</label>
    <input id="phone" type="tel" placeholder="+234…" />
    <label>School ID or National ID *</label>
    <input id="identity" />
    <label>Country *</label>
    <input id="country" value="NG" />
    <label>State</label>
    <input id="state" />
    <label>LGA *</label>
    <input id="lga" />
    <button class="btn primary" id="btn" onclick="reg()">Continue to vote</button>
    <p class="err" id="error"></p>
  </div>
  <script src="/js/api.js"></script>
  <script>
    async function reg() {
      const election_credential = document.getElementById("credential").value.trim();
      const full_name = document.getElementById("fullName").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const identity_number = document.getElementById("identity").value.trim();
      const country = document.getElementById("country").value.trim();
      const state = document.getElementById("state").value.trim();
      const lga = document.getElementById("lga").value.trim();
      const err = document.getElementById("error");
      const btn = document.getElementById("btn");
      if (!election_credential || !full_name || !phone || !identity_number || !country || !lga) {
        err.textContent = "Fill required fields";
        return;
      }
      btn.disabled = true;
      try {
        const data = await ElectionsAPI.registerVoter({
          election_credential, full_name, phone, identity_number,
          country, state: state || null, lga
        });
        sessionStorage.setItem("voterId", data.voter_id);
        sessionStorage.setItem("electionCredential", election_credential);
        window.location.href = "/pages/e-voting/voting.html";
      } catch (e) {
        err.textContent = e.message;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
