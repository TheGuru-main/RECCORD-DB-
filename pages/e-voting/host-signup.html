<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Host signup — E-Voting</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="page">
    <a class="back-link" href="/pages/e-voting/type.html">← Back</a>
    <h2>Election Host</h2>
    <p>These details identify you as host for this device session.</p>

    <label>Full name *</label>
    <input id="hostName" />
    <label>Phone *</label>
    <input id="hostPhone" type="tel" placeholder="+234…" />
    <label>School ID or National ID *</label>
    <input id="hostIdentity" />

    <button class="btn primary" onclick="saveHost()">Continue to dashboard</button>
    <p class="err" id="error"></p>
  </div>
  <script>
    function saveHost() {
      const hostName = document.getElementById("hostName").value.trim();
      const hostPhone = document.getElementById("hostPhone").value.trim();
      const hostIdentity = document.getElementById("hostIdentity").value.trim();
      const err = document.getElementById("error");
      if (!hostName || !hostPhone || !hostIdentity) {
        err.textContent = "All fields are required";
        return;
      }
      // Persist across refresh (Phase 2 requirement)
      localStorage.setItem("evote_host_name", hostName);
      localStorage.setItem("evote_host_phone", hostPhone);
      localStorage.setItem("evote_host_identity", hostIdentity);
      sessionStorage.setItem("hostName", hostName);
      sessionStorage.setItem("hostPhone", hostPhone);
      sessionStorage.setItem("hostIdentity", hostIdentity);
      window.location.href = "/pages/e-voting/host-dashboard.html";
    }
  </script>
</body>
</html>
