<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create election — E-Voting</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="page">
    <a class="back-link" href="/pages/e-voting/host-dashboard.html">← Back</a>
    <h2>Create election</h2>

    <label>Election name *</label>
    <input id="title" />
    <label>Level *</label>
    <input id="level" placeholder="School, Faculty, National…" />
    <label>Description</label>
    <textarea id="description" rows="3"></textarea>

    <button class="btn primary" id="btn" onclick="createEl()">Next: Add candidates</button>
    <p class="err" id="error"></p>
  </div>
  <script src="/js/api.js"></script>
  <script>
    async function createEl() {
      const title = document.getElementById("title").value.trim();
      const level = document.getElementById("level").value.trim();
      const description = document.getElementById("description").value.trim();
      const err = document.getElementById("error");
      const btn = document.getElementById("btn");
      if (!title || !level) { err.textContent = "Name and level required"; return; }

      const hostName = localStorage.getItem("evote_host_name") || sessionStorage.getItem("hostName") || "Host";
      const hostPhone = localStorage.getItem("evote_host_phone") || sessionStorage.getItem("hostPhone") || "";
      const hostIdentity = localStorage.getItem("evote_host_identity") || sessionStorage.getItem("hostIdentity") || "";
      const electionType = sessionStorage.getItem("evoteType") || "institution";

      if (!hostPhone) {
        err.textContent = "Host phone missing — complete host signup first";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Creating…";
      err.textContent = "";
      try {
        const data = await ElectionsAPI.create({
          title: title,
          description: description || null,
          election_type: electionType,
          level: level,
          host_name: hostName,
          host_phone: hostPhone,
          host_identity_number: hostIdentity
        });
        sessionStorage.setItem("currentElectionId", data.id);
        sessionStorage.setItem("currentElectionCredential", data.election_id);
        sessionStorage.setItem("electionTitle", title);
        window.location.href = "/pages/e-voting/add-candidates.html";
      } catch (e) {
        err.textContent = e.message;
        btn.disabled = false;
        btn.textContent = "Next: Add candidates";
      }
    }
  </script>
</body>
</html>
