<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Type — E-Voting</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="page">
    <a class="back-link" href="/pages/e-voting/role.html">← Back</a>
    <h2>Election type</h2>
    <div class="stack">
      <button class="btn primary" onclick="pick('government')">Government</button>
      <button class="btn primary" onclick="pick('institution')">Institution</button>
    </div>
  </div>
  <script>
    function pick(t) {
      sessionStorage.setItem("evoteType", t);
      const role = sessionStorage.getItem("evoteRole") || "voter";
      if (role === "host") {
        window.location.href = "/pages/e-voting/host-signup.html";
      } else {
        window.location.href = "/pages/e-voting/voter-signup.html";
      }
    }
  </script>
</body>
</html>
