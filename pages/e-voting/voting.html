<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vote</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../../css/style.css" />
  <style>
    .candidate {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      cursor: pointer;
    }
    .candidate.selected {
      border-color: #2563eb;
      background: #1e3a5f;
    }
    .candidate-info { flex: 1; }
    .toggle {
      width: 48px; height: 28px;
      background: #475569;
      border-radius: 999px;
      position: relative;
      flex-shrink: 0;
    }
    .toggle::after {
      content: "";
      position: absolute;
      top: 3px; left: 3px;
      width: 22px; height: 22px;
      background: white;
      border-radius: 50%;
      transition: 0.2s;
    }
    .candidate.selected .toggle { background: #2563eb; }
    .candidate.selected .toggle::after { left: 23px; }
  </style>
</head>
<body>
  <div class="page">
    <h2 id="electionTitle">Cast Your Vote</h2>
    <p>Select one candidate. Toggling another moves your vote.</p>

    <div id="candidatesArea">
      <p style="color:#94a3b8;">Loading candidates...</p>
    </div>

    <button class="btn primary" id="submitBtn" onclick="submitVote()" disabled>Submit Vote</button>
    <p id="error" style="color:#f87171;margin-top:1rem;"></p>
  </div>

  <script src="../../js/api.js"></script>
  <script>
    const electionId = sessionStorage.getItem('votingElectionId');
    const title = sessionStorage.getItem('votingElectionTitle');
    if (title) document.getElementById('electionTitle').textContent = title;

    let selectedId = null;

    async function loadCandidates() {
      const area = document.getElementById('candidatesArea');
      const errorEl = document.getElementById('error');

      if (!electionId) {
        area.innerHTML = "<p style='color:#f87171;'>No election found. Please register again.</p>";
        return;
      }

      try {
        const data = await ElectionsAPI.listCandidates(electionId);
        const list = data.candidates || [];

        if (list.length === 0) {
          area.innerHTML = "<p style='color:#94a3b8;'>No candidates available for this election.</p>";
          return;
        }

        area.innerHTML = list.map(c => `
          <div class="candidate" data-id="${c.id}" onclick="selectCandidate(this)">
            <div class="candidate-info">
              <strong>${c.name}</strong>
              <div style="font-size:0.85rem;color:#94a3b8;">${c.party || ""}</div>
              \( {c.details ? `<div style="font-size:0.8rem;color:#64748b;margin-top:0.25rem;"> \){c.details}</div>` : ""}
            </div>
            <div class="toggle"></div>
          </div>
        `).join("");

        document.getElementById('submitBtn').disabled = false;
      } catch (err) {
        area.innerHTML = "";
        errorEl.textContent = err.message;
      }
    }

    function selectCandidate(el) {
      document.querySelectorAll('.candidate').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      selectedId = el.getAttribute('data-id');
    }

    async function submitVote() {
      const errorEl = document.getElementById('error');
      const btn = document.getElementById('submitBtn');
      const voterId = sessionStorage.getItem('voterId');

      if (!selectedId) {
        errorEl.textContent = "Please select a candidate";
        return;
      }
      if (!voterId) {
        errorEl.textContent = "Voter session missing. Register again.";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Submitting...";
      errorEl.textContent = "";

      try {
        await ElectionsAPI.castVote({
          voter_id: voterId,
          candidate_id: selectedId
        });
        window.location.href = "confirmation.html";
      } catch (err) {
        errorEl.textContent = err.message;
        btn.disabled = false;
        btn.textContent = "Submit Vote";
      }
    }

    loadCandidates();
  </script>
</body>
</html>
