<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vote — E-Voting</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .candidate {
      background: rgba(26,10,12,0.55);
      border: 2px solid rgba(196,164,132,0.35);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      cursor: pointer;
    }
    .candidate.selected { border-color: #fbbf24; }
    .candidate-info { flex: 1; }
  </style>
</head>
<body>
  <div class="page">
    <a class="back-link" href="/pages/e-voting/voter-signup.html">← Back</a>
    <h2 id="electionTitle">Cast your vote</h2>
    <p>Select one candidate. Tapping another moves your vote.</p>
    <div id="candidatesArea"><p style="opacity:0.85;">Loading candidates…</p></div>
    <button class="btn primary" id="submitBtn" onclick="submitVote()">Submit vote</button>
    <p class="err" id="error"></p>
  </div>
  <script src="/js/api.js"></script>
  <script>
    let selectedId = null;
    let electionUuid = sessionStorage.getItem("voteElectionUuid") || "";
    const credential = sessionStorage.getItem("electionCredential") || "";
    const voterId = sessionStorage.getItem("voterId") || "";

    function escapeHtml(s) {
      return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function selectCandidate(el) {
      document.querySelectorAll(".candidate").forEach(function (c) {
        c.classList.remove("selected");
      });
      el.classList.add("selected");
      selectedId = el.getAttribute("data-id");
    }

    async function load() {
      const area = document.getElementById("candidatesArea");
      const err = document.getElementById("error");
      try {
        if (!electionUuid && credential) {
          const el = await ElectionsAPI.getByCredential(credential);
          electionUuid = el.id;
          sessionStorage.setItem("voteElectionUuid", electionUuid);
          document.getElementById("electionTitle").textContent = el.title || "Cast your vote";
        }
        if (!electionUuid) {
          area.innerHTML = "<p>Missing election. Register again with Election ID.</p>";
          return;
        }
        const data = await ElectionsAPI.listCandidates(electionUuid);
        const list = data.candidates || [];
        if (!list.length) {
          area.innerHTML = "<p>No candidates published for this election.</p>";
          return;
        }
        area.innerHTML = list.map(function (c) {
          return (
            '<div class="candidate" data-id="' + escapeHtml(c.id) + '" onclick="selectCandidate(this)">' +
            '<div class="candidate-info"><strong>' + escapeHtml(c.name) + "</strong>" +
            '<p style="margin:0.25rem 0 0;font-size:0.85rem;opacity:0.85;">' +
            escapeHtml(c.party || "") + "</p>" +
            (c.about || c.details
              ? '<div class="desc-box" style="margin-top:0.4rem;">' +
                escapeHtml(c.about || c.details) + "</div>"
              : "") +
            "</div></div>"
          );
        }).join("");
      } catch (e) {
        err.textContent = e.message;
        area.innerHTML = "";
      }
    }

    async function submitVote() {
      const err = document.getElementById("error");
      const btn = document.getElementById("submitBtn");
      err.textContent = "";
      if (!selectedId) { err.textContent = "Select a candidate"; return; }
      if (!voterId) { err.textContent = "Voter session missing — sign up again"; return; }
      btn.disabled = true;
      try {
        await ElectionsAPI.castVote({ voter_id: voterId, candidate_id: selectedId });
        window.location.href = "/pages/e-voting/confirmation.html";
      } catch (e) {
        err.textContent = e.message;
        btn.disabled = false;
      }
    }
    load();
  </script>
</body>
</html>
