<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Role — E-Voting</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="page">
    <a class="back-link" href="/pages/e-voting/entry.html">← Back</a>
    <h2>Your role</h2>
    <p>Host runs the election. Voter casts a ballot with an Election ID.</p>
    <div class="stack">
      <button class="btn primary" onclick="choose('host')">Election Host</button>
      <button class="btn clay" onclick="choose('voter')">Voter</button>
    </div>
  </div>
  <script>
    function choose(role) {
      sessionStorage.setItem("evoteRole", role);
      window.location.href = "/pages/e-voting/type.html";
    }
  </script>
</body>
</html>
