<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select Role — E-Voting</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body>
  <div class="page">
    <h2>Select Role</h2>
    <a href="#" class="btn primary" onclick="choose('host')">Signup as Election Host</a>
    <a href="#" class="btn secondary" onclick="choose('voter')">Signup as Voter</a>
    <a href="entry.html" class="btn">← Back</a>
  </div>

  <script>
    function choose(role) {
      sessionStorage.setItem('evoteRole', role);
      window.location.href = 'type.html';
    }
  </script>
</body>
</html>
