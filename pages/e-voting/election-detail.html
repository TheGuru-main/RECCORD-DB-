<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Election detail — E-Voting</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="page">
    <a class="back-link" href="/pages/e-voting/host-dashboard.html">← Back</a>
    <h2 id="title">Election</h2>
    <div class="card">
      <p style="margin:0;font-size:0.9rem;" id="meta">—</p>
      <p style="margin:0.5rem 0 0;word-break:break-all;color:var(--clay);" id="cred">—</p>
      <button class="btn clay" style="margin-top:0.75rem;" type="button" onclick="copyCred()">Copy Election ID</button>
    </div>

    <h3 style="font-size:1rem;">Candidates</h3>
    <div id="cands"><p style="opacity:0.8;">Loading…</p></div>

    <h3 style="font-size:1rem;margin-top:1rem;">Results</h3>
    <div id="results"><p style="opacity:0.8;">—</p></div>
    <p class="err" id="error"></p>
  </div>
  <script src="/js/api.js"></script>
  <script>
    const electionId = sessionStorage.getItem("detail_election_id");
    const credential = sessionStorage.getItem("detail_election_credential") || "";
    document.getElementById("cred").textContent = credential ? "ID: " + credential : "";

    function copyCred() {
      if (credential) navigator.clipboard.writeText(credential).catch(function () {});
    }
    function escapeHtml(s) {
      return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    async function load() {
      if (!electionId) {
        document.getElementById("error").textContent = "No election selected";
        return;
      }
      try {
        if (credential) {
          const el = await ElectionsAPI.getByCredential(credential);
          document.getElementById("title").textContent = el.title || "Election";
          document.getElementById("meta").textContent =
            (el.status || "") + " · " + (el.election_type || "") + " · " + (el.level || "");
        }
        const data = await ElectionsAPI.listCandidates(electionId);
        const list = data.candidates || [];
        const box = document.getElementById("cands");
        if (!list.length) {
          box.innerHTML = '<div class="card"><p style="margin:0;">No candidates</p></div>';
        } else {
          box.innerHTML = list.map(function (c) {
            return (
              '<div class="card" style="cursor:pointer;" onclick="openCand(\'' + escapeHtml(c.id) + '\')">' +
              "<strong>" + escapeHtml(c.name) + "</strong>" +
              '<p style="margin:0.3rem 0 0;font-size:0.85rem;opacity:0.85;">' +
              escapeHtml(c.party || "") + "</p></div>"
            );
          }).join("");
        }
        try {
          const res = await ElectionsAPI.getResults(electionId);
          const rows = res.results || res || [];
          const rbox = document.getElementById("results");
          if (Array.isArray(rows) && rows.length) {
            rbox.innerHTML = rows.map(function (r, i) {
              return (
                '<div class="card"><strong>#' + (i + 1) + " " + escapeHtml(r.name || r.candidate_name || "") +
                "</strong><p style=\"margin:0.3rem 0 0;font-size:0.85rem;\">Votes: " +
                escapeHtml(String(r.votes != null ? r.votes : r.count != null ? r.count : "—")) +
                "</p></div>"
              );
            }).join("");
          } else {
            rbox.innerHTML = '<div class="card"><p style="margin:0;opacity:0.85;">No results yet</p></div>';
          }
        } catch (e2) {
          document.getElementById("results").innerHTML =
            '<div class="card"><p style="margin:0;opacity:0.85;">Results unavailable</p></div>';
        }
      } catch (e) {
        document.getElementById("error").textContent = e.message;
      }
    }

    function openCand(id) {
      sessionStorage.setItem("detail_candidate_id", id);
      sessionStorage.setItem("detail_candidate_election_id", electionId);
      window.location.href = "/pages/e-voting/candidate-detail.html";
    }

    load();
  </script>
</body>
</html>
