<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add candidates — E-Voting</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="page">
    <a class="back-link" href="/pages/e-voting/create-election.html">← Back</a>
    <h2>Add candidates</h2>
    <p id="electionLabel"></p>
    <div id="candidateList"></div>

    <div class="card">
      <label>Candidate name *</label>
      <input id="candName" />
      <label>Party</label>
      <input id="candParty" />
      <label>About / narration</label>
      <textarea id="candAbout" rows="3"></textarea>
      <label>Country</label>
      <input id="candCountry" placeholder="NG" />
      <label>State</label>
      <input id="candState" />
      <label>LGA</label>
      <input id="candLga" />
      <button class="btn clay" type="button" onclick="addCandidate()">+ Add candidate</button>
    </div>

    <button class="btn primary" id="finishBtn" onclick="finish()">Finish &amp; publish</button>
    <p class="err" id="error"></p>
  </div>
  <script src="/js/api.js"></script>
  <script>
    const electionId = sessionStorage.getItem("currentElectionId");
    const electionTitle = sessionStorage.getItem("electionTitle") || "Election";
    document.getElementById("electionLabel").textContent = electionTitle;
    let candidates = [];

    function escapeHtml(s) {
      return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function renderList() {
      document.getElementById("candidateList").innerHTML = candidates.map(function (c, i) {
        return (
          '<div class="card" style="cursor:pointer;" onclick="openCand(\'' + escapeHtml(c.id) + '\')">' +
          "<strong>" + (i + 1) + ". " + escapeHtml(c.name) + "</strong>" +
          '<p style="margin:0.3rem 0 0;font-size:0.85rem;opacity:0.85;">' +
          escapeHtml(c.party || "No party") +
          [c.country, c.state, c.lga].filter(Boolean).map(function (x) { return " · " + escapeHtml(x); }).join("") +
          "</p></div>"
        );
      }).join("");
    }

    function openCand(id) {
      sessionStorage.setItem("detail_candidate_id", id);
      sessionStorage.setItem("detail_candidate_election_id", electionId);
      window.location.href = "/pages/e-voting/candidate-detail.html";
    }

    async function addCandidate() {
      const name = document.getElementById("candName").value.trim();
      const party = document.getElementById("candParty").value.trim();
      const about = document.getElementById("candAbout").value.trim();
      const country = document.getElementById("candCountry").value.trim();
      const state = document.getElementById("candState").value.trim();
      const lga = document.getElementById("candLga").value.trim();
      const err = document.getElementById("error");
      err.textContent = "";
      if (!name) { err.textContent = "Name required"; return; }
      if (!electionId) { err.textContent = "No election — create again"; return; }
      try {
        const data = await ElectionsAPI.addCandidate({
          election_id: electionId,
          name: name,
          party: party || null,
          about: about || null,
          details: about || null,
          country: country || null,
          state: state || null,
          lga: lga || null
        });
        candidates.push({
          id: data.id,
          name: data.name,
          party: data.party,
          about: data.about,
          country: data.country,
          state: data.state,
          lga: data.lga
        });
        renderList();
        document.getElementById("candName").value = "";
        document.getElementById("candParty").value = "";
        document.getElementById("candAbout").value = "";
        document.getElementById("candLga").value = "";
        document.getElementById("candState").value = "";
      } catch (e) {
        err.textContent = e.message;
      }
    }

    async function finish() {
      const err = document.getElementById("error");
      const btn = document.getElementById("finishBtn");
      if (candidates.length < 1) { err.textContent = "Add at least one candidate"; return; }
      btn.disabled = true;
      btn.textContent = "Publishing…";
      try {
        const pub = await ElectionsAPI.publish(electionId);
        const credential = pub.election_id || sessionStorage.getItem("currentElectionCredential") || "";
        sessionStorage.setItem("last_published_credential", credential);
        sessionStorage.setItem("currentElectionCredential", credential);
        window.location.href = "/pages/e-voting/host-dashboard.html";
      } catch (e) {
        err.textContent = e.message;
        btn.disabled = false;
        btn.textContent = "Finish & publish";
      }
    }
  </script>
</body>
</html>
