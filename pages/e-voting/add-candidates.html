<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Candidates</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body>
  <div class="page">
    <h2>Add Candidates</h2>
    <p id="electionLabel"></p>

    <div id="candidateList"></div>

    <div class="card">
      <label>Candidate Name *</label>
      <input type="text" id="candName" placeholder="Full name" />

      <label>Party / Affiliation</label>
      <input type="text" id="candParty" placeholder="Party name" />

      <label>Short Details</label>
      <textarea id="candDetails" rows="2" placeholder="Bio or manifesto summary"></textarea>

      <button class="btn secondary" onclick="addCandidate()">+ Add This Candidate</button>
    </div>

    <button class="btn primary" id="finishBtn" onclick="finish()">Finish & Publish Election</button>
    <a href="create-election.html" class="btn">← Back</a>
    <p id="error" style="color:#f87171;margin-top:1rem;"></p>
    <p id="credentialBox" style="margin-top:1rem;font-size:0.9rem;color:#4ade80;"></p>
  </div>

  <script src="../../js/api.js"></script>
  <script>
    const electionId = sessionStorage.getItem('currentElectionId');
    const electionTitle = sessionStorage.getItem('electionTitle') || "Election";
    document.getElementById('electionLabel').textContent = electionTitle;

    let candidates = [];

    async function addCandidate() {
      const name = document.getElementById('candName').value.trim();
      const party = document.getElementById('candParty').value.trim();
      const details = document.getElementById('candDetails').value.trim();
      const errorEl = document.getElementById('error');

      if (!name) {
        errorEl.textContent = "Candidate name is required";
        return;
      }
      if (!electionId) {
        errorEl.textContent = "No election selected. Start again.";
        return;
      }

      errorEl.textContent = "";
      try {
        await ElectionsAPI.addCandidate({
          election_id: electionId,
          name,
          party: party || null,
          details: details || null
        });

        candidates.push({ name, party });
        renderList();

        document.getElementById('candName').value = '';
        document.getElementById('candParty').value = '';
        document.getElementById('candDetails').value = '';
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }

    function renderList() {
      const list = document.getElementById('candidateList');
      list.innerHTML = candidates.map((c, i) =>
        `<div class="card"><strong>${i + 1}. ${c.name}</strong><br>
         <span style="color:#94a3b8;font-size:0.9rem">${c.party || 'No party'}</span></div>`
      ).join('');
    }

    async function finish() {
      const errorEl = document.getElementById('error');
      const btn = document.getElementById('finishBtn');
      if (candidates.length < 1) {
        errorEl.textContent = "Add at least one candidate";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Publishing...";
      try {
        await ElectionsAPI.publish(electionId);
        const credential = sessionStorage.getItem('currentElectionCredential');
        document.getElementById('credentialBox').textContent =
          "Election published! Share this Election ID with voters: " + credential;
        btn.textContent = "Published";
        setTimeout(() => {
          window.location.href = "host-dashboard.html";
        }, 2500);
      } catch (err) {
        errorEl.textContent = err.message;
        btn.disabled = false;
        btn.textContent = "Finish & Publish Election";
      }
    }
  </script>
</body>
</html>
