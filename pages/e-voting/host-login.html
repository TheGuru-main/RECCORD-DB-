<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Host login — E-Voting</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="page">
    <a class="back-link" href="/pages/e-voting/entry.html">← Back</a>
    <h2>Host access</h2>
    <p>Use the same host phone you registered with. Works on any device — list loads from the server.</p>

    <label>Host phone *</label>
    <input id="phone" type="tel" placeholder="+234…" />
    <label>Display name (optional)</label>
    <input id="name" placeholder="Your name" />

    <button class="btn primary" id="btn" onclick="enter()">Open dashboard</button>
    <p class="err" id="error"></p>
    <a class="btn ghost" href="/pages/e-voting/host-signup.html">First time? Host signup</a>
  </div>
  <script src="/js/api.js"></script>
  <script>
    async function enter() {
      const phone = document.getElementById("phone").value.trim();
      const name = document.getElementById("name").value.trim();
      const err = document.getElementById("error");
      const btn = document.getElementById("btn");
      if (!phone) { err.textContent = "Phone required"; return; }
      btn.disabled = true;
      btn.textContent = "Loading…";
      try {
        // Prove server has data for this host (cross-device)
        await ElectionsAPI.listHostElections(phone);
        localStorage.setItem("evote_host_phone", phone);
        if (name) localStorage.setItem("evote_host_name", name);
        sessionStorage.setItem("hostPhone", phone);
        if (name) sessionStorage.setItem("hostName", name);
        window.location.href = "/pages/e-voting/host-dashboard.html";
      } catch (e) {
        err.textContent = e.message;
        btn.disabled = false;
        btn.textContent = "Open dashboard";
      }
    }
  </script>
</body>
</html>
