<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Host login — E-Voting</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="page">
    <a class="back-link" href="/pages/e-voting/entry.html">← Back</a>
    <h2>Host login</h2>
    <p>Any device. Uses your host phone + password.</p>
    <label>Host phone *</label>
    <input id="phone" type="tel" placeholder="+234…" />
    <label>Password *</label>
    <input id="password" type="password" />
    <button class="btn primary" id="btn" onclick="enter()">Open dashboard</button>
    <p class="err" id="error"></p>
    <a class="btn ghost" href="/pages/e-voting/host-signup.html">First time? Host signup</a>
  </div>
  <script src="/js/api.js"></script>
  <script>
    async function enter() {
      const host_phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;
      const err = document.getElementById("error");
      const btn = document.getElementById("btn");
      if (!host_phone || !password) { err.textContent = "Phone and password required"; return; }
      btn.disabled = true;
      try {
        const data = await api("/hosts/login", {
          method: "POST",
          body: { host_phone, password }
        });
        localStorage.setItem("evote_host_phone", data.host_phone);
        localStorage.setItem("evote_host_name", data.host_name || "");
        if (data.identity_number) localStorage.setItem("evote_host_identity", data.identity_number);
        sessionStorage.setItem("hostPhone", data.host_phone);
        sessionStorage.setItem("hostName", data.host_name || "");
        window.location.href = "/pages/e-voting/host-dashboard.html";
      } catch (e) {
        err.textContent = e.message;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
