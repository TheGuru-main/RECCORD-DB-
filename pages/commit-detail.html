<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Placement detail — RECCORD DB</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="page">
    <a class="back-link" href="/pages/home.html">← Back</a>
    <h2 id="title">Placement</h2>
    <div class="card" id="meta"></div>
    <h3 style="font-size:1rem;">Narration</h3>
    <div id="narr" class="card"><p style="margin:0;opacity:0.85;">—</p></div>
    <h3 style="font-size:1rem;">Media</h3>
    <div id="mediaBox" class="card"><p style="margin:0;opacity:0.85;">—</p></div>
    <p class="err" id="error"></p>
  </div>
  <script src="/js/api.js"></script>
  <script>
    function escapeHtml(s) {
      return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }
    async function load() {
      let p = {};
      try { p = JSON.parse(sessionStorage.getItem("detail_placement") || "{}"); } catch (e) {}
      const oid = p.object_id || sessionStorage.getItem("detail_object_id");
      document.getElementById("title").textContent = p.object_name || "Placement";
      const lines = [
        ["Name", p.object_name],
        ["Time", p.created_at ? new Date(p.created_at).toLocaleString() : ""],
        ["GSP", p.gsp_key],
        ["Object", oid]
      ];
      if (oid) {
        try {
          const obj = await ObjectsAPI.get(oid);
          if (obj.name) document.getElementById("title").textContent = obj.name;
          lines.push(["Status", obj.status]);
        } catch (e) {}
        try {
          if (NarrationsAPI.byObject) {
            const n = await NarrationsAPI.byObject(oid);
            const list = n.narrations || [];
            document.getElementById("narr").innerHTML = list.length
              ? list.map(function (x) {
                  return "<p style=\"margin:0 0 0.5rem;white-space:pre-wrap;\">" +
                    escapeHtml(x.content) + "</p>";
                }).join("")
              : "<p style=\"margin:0;opacity:0.85;\">No narration</p>";
          }
        } catch (e) {
          document.getElementById("narr").innerHTML = "<p style=\"margin:0;opacity:0.85;\">—</p>";
        }
        try {
          if (typeof MediaAPI !== "undefined") {
            const m = await MediaAPI.list(oid);
            const files = m.files || [];
            document.getElementById("mediaBox").innerHTML = files.length
              ? files.map(function (f) {
                  const isImg = (f.content_type || "").indexOf("image/") === 0;
                  return (
                    "<div style=\"margin-bottom:0.75rem;\">" +
                    "<strong>" + escapeHtml(f.filename) + "</strong>" +
                    "<p style=\"margin:0.25rem 0;font-size:0.8rem;opacity:0.75;\">" +
                    escapeHtml(f.content_type) + " · " + escapeHtml(String(f.size || "")) + " bytes</p>" +
                    "<p style=\"margin:0;font-size:0.75rem;word-break:break-all;opacity:0.65;\">" +
                    escapeHtml(f.key) + "</p>" +
                    (isImg ? "<p style=\"margin:0.35rem 0 0;font-size:0.8rem;color:var(--clay);\">Image stored on tenant B2</p>" : "") +
                    "</div>"
                  );
                }).join("")
              : "<p style=\"margin:0;opacity:0.85;\">No media files</p>";
          }
        } catch (e) {
          document.getElementById("mediaBox").innerHTML =
            "<p style=\"margin:0;opacity:0.85;\">Media list unavailable</p>";
        }
      }
      document.getElementById("meta").innerHTML = lines
        .filter(function (r) { return r[1]; })
        .map(function (r) {
          return "<p style=\"margin:0 0 0.45rem;\"><span style=\"opacity:0.7;\">" +
            escapeHtml(r[0]) + ":</span> " + escapeHtml(r[1]) + "</p>";
        }).join("");
    }
    load();
  </script>
</body>
</html>
