<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Placement detail — RECCORD DB</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="page">
    <a class="back-link" href="/pages/home.html">← Back</a>
    <h2 id="title">Placement</h2>
    <div class="card" id="body"><p style="margin:0;">Loading…</p></div>
    <p class="err" id="error"></p>
  </div>
  <script src="/js/api.js"></script>
  <script>
    function escapeHtml(s) {
      return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }
    async function load() {
      let p = {};
      try { p = JSON.parse(sessionStorage.getItem("detail_placement") || "{}"); } catch (e) {}
      const oid = p.object_id || sessionStorage.getItem("detail_object_id");
      document.getElementById("title").textContent = p.object_name || "Placement";
      let lines = [
        ["Name", p.object_name],
        ["Time", p.created_at ? new Date(p.created_at).toLocaleString() : ""],
        ["GSP key", p.gsp_key],
        ["Placement ID", p.placement_id],
        ["Object ID", oid]
      ];
      if (oid) {
        try {
          const obj = await ObjectsAPI.get(oid);
          lines.push(["Status", obj.status]);
          if (obj.name) document.getElementById("title").textContent = obj.name;
        } catch (e) { /* optional */ }
      }
      document.getElementById("body").innerHTML = lines
        .filter(function (r) { return r[1]; })
        .map(function (r) {
          return "<p style=\"margin:0 0 0.5rem;\"><span style=\"opacity:0.7;\">" +
            escapeHtml(r[0]) + ":</span> " + escapeHtml(r[1]) + "</p>";
        }).join("") || "<p style=\"margin:0;\">No detail</p>";
    }
    load();
  </script>
</body>
</html>
