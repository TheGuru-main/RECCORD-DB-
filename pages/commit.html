<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Commit — RECCORD DB</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.75rem;
    }
    .tools button {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 0.4rem 0.6rem;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .tools button:active {
      background: #334155;
    }
    textarea {
      min-height: 140px;
      resize: vertical;
    }
  </style>
</head>
<body>
  <div class="page">
    <h2>New Commit</h2>

    <label>Object / Title *</label>
    <input type="text" id="objectName" placeholder="What are you recording?" />

    <label>Narration</label>
    <div class="tools">
      <button type="button" onclick="format('bold')"><i class="fa fa-bold"></i></button>
      <button type="button" onclick="format('underline')"><i class="fa fa-underline"></i></button>
      <button type="button" onclick="format('insertUnorderedList')"><i class="fa fa-list-ul"></i></button>
      <button type="button" title="Copy"><i class="fa fa-copy"></i></button>
      <button type="button" title="Calculator"><i class="fa fa-calculator"></i></button>
      <button type="button" title="Align Center"><i class="fa fa-align-center"></i></button>
    </div>
    <textarea id="narration" placeholder="Details, notes, story..."></textarea>

    <label>Record Type *</label>
    <select id="recordType">
      <option value="append">Append Only</option>
      <option value="mutable">Mutable</option>
      <option value="immutable">Immutable</option>
    </select>

    <label>Attach Media (Image / Voice / Video / Document)</label>
    <input type="file" id="media" accept="image/*,audio/*,video/*,.pdf,.doc,.docx" />

    <button class="btn primary" onclick="submitCommit()">Commit</button>
    <a href="home.html" class="btn">Cancel</a>
  </div>

  <script>
    function format(cmd) {
      document.execCommand(cmd, false, null);
    }

    function submitCommit() {
      const name = document.getElementById('objectName').value.trim();
      if (!name) {
        alert('Object / Title is required');
        return;
      }
      // Later: send to backend
      alert('Commit recorded (demo)');
      window.location.href = 'home.html';
    }
  </script>
</body>
</html>
