<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Commit — RECCORD DB</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="page">
    <a class="back-link" href="/pages/home.html">← Back</a>
    <h2>New Commit</h2>
    <label>Object name *</label>
    <input id="objectName" placeholder="Title only" />
    <label>Description</label>
    <textarea id="description" rows="4" placeholder="Description (shown in its own box)"></textarea>
    <label>Media (optional)</label>
    <input type="file" id="media" accept="image/*,audio/*,video/*,.pdf" />
    <button class="btn primary" id="submitBtn" onclick="submitCommit()">Commit</button>
    <p class="err" id="error"></p>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/shell.js"></script>
  <script>
    if (typeof requireAuth === "function" && !requireAuth()) throw new Error("auth");

    function readFileAsBase64(file) {
      return new Promise(function (resolve, reject) {
        const r = new FileReader();
        r.onload = function () { resolve(r.result); };
        r.onerror = reject;
        r.readAsDataURL(file);
      });
    }

    async function submitCommit() {
      const name = document.getElementById("objectName").value.trim();
      const description = document.getElementById("description").value.trim();
      const fileInput = document.getElementById("media");
      const err = document.getElementById("error");
      const btn = document.getElementById("submitBtn");
      err.textContent = "";
      if (!name) { err.textContent = "Object name required"; return; }
      btn.disabled = true;
      btn.textContent = "Committing…";
      try {
        const obj = await api("/objects", {
          method: "POST",
          body: { name: name, description: description || null }
        });
        if (description) {
          try { await NarrationsAPI.create(obj.id, description); } catch (e) {}
        }
        const file = fileInput.files && fileInput.files[0];
        if (file && typeof MediaAPI !== "undefined") {
          const dataUrl = await readFileAsBase64(file);
          await MediaAPI.upload(obj.id, file.name, file.type || "application/octet-stream", dataUrl);
        }
        window.location.href = "/pages/home.html";
      } catch (e) {
        err.textContent = e.message;
        btn.disabled = false;
        btn.textContent = "Commit";
      }
    }
  </script>
</body>
</html>
