<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workspace — RECCORD DB</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem; }
    .stat-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 0.9rem; text-align: center;
    }
    .stat-card strong { display: block; font-size: 1.25rem; color: #60a5fa; }
    .stat-card span { font-size: 0.8rem; color: #94a3b8; }
    .section-title {
      font-size: 0.85rem; color: #94a3b8; margin: 1.1rem 0 0.45rem;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .mini-grid {
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      gap: 2px;
      background: #0f172a;
      padding: 6px;
      border-radius: 10px;
      border: 1px solid #334155;
      max-height: 180px;
      overflow: hidden;
    }
    .mini-grid span {
      aspect-ratio: 1;
      background: #1e293b;
      border-radius: 2px;
    }
    .mini-grid span.on { background: #2563eb; }
  </style>
</head>
<body>
  <header class="app-header">
    <button class="menu-btn" onclick="openDrawer()"><i class="fa fa-bars"></i></button>
    <span class="title">Workspace</span>
    <span class="user-label" id="headerName">—</span>
  </header>

  <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
  <aside class="side-drawer" id="sideDrawer">
    <div class="drawer-section">Menu</div>
    <a href="home.html" class="active">Workspace</a>
    <a href="lookup.html">Lookup</a>
    <a href="messages.html">Messages</a>
    <a href="records.html">Records</a>
    <a href="profile.html">Profile</a>
    <div class="drawer-section" id="adminSection" style="display:none;">Admin</div>
    <a href="workers.html" id="workersLink" style="display:none;">Workers</a>
    <a href="#" onclick="logout()" style="color:#f87171;">Logout</a>
  </aside>

  <div class="page">
    <p id="welcomeText" style="margin-bottom:1rem;">Welcome</p>
    <div class="stats">
      <div class="stat-card"><strong id="commitCount">0</strong><span>Local commits</span></div>
      <div class="stat-card"><strong id="roleLabel">—</strong><span>Account</span></div>
    </div>

    <div class="section-title">Placement Grid (this tenant only)</div>
    <div class="mini-grid" id="miniGrid" title="Visual stand-in for 54×64 GSP grid"></div>
    <p style="font-size:0.8rem;color:#64748b;margin-top:0.4rem;">Per-tenant GSP • not a global shared grid</p>

    <div class="section-title">Recent Activity</div>
    <div id="recentList">
      <div class="card"><p style="margin:0;font-size:0.9rem;color:#94a3b8;">No recent commits yet.</p></div>
    </div>
  </div>

  <a href="commit.html" class="fab"><i class="fa fa-plus"></i></a>

  <nav class="bottom-nav">
    <a href="home.html" class="active"><i class="fa fa-home"></i>Home</a>
    <a href="lookup.html"><i class="fa fa-search"></i>Lookup</a>
    <a href="messages.html"><i class="fa fa-comments"></i>Messages</a>
    <a href="records.html"><i class="fa fa-folder-open"></i>Records</a>
    <a href="profile.html"><i class="fa fa-user"></i>Me</a>
  </nav>

  <script src="../js/api.js"></script>
  <script src="../js/shell.js"></script>
  <script>
    if (!requireAuth()) throw new Error('auth');
    const name = getDisplayName();
    document.getElementById('headerName').textContent = name;
    document.getElementById('welcomeText').textContent = 'Welcome, ' + name;
    const type = localStorage.getItem('reccord_account_type') || '';
    document.getElementById('roleLabel').textContent =
      type === 'organisation' ? 'Admin' : type === 'worker' ? 'Worker' : 'Regular';
    if (isAdmin()) {
      document.getElementById('adminSection').style.display = 'block';
      document.getElementById('workersLink').style.display = 'block';
    }

    // Mini grid visual (16x8 cells lit by recent count)
    const grid = document.getElementById('miniGrid');
    const recent = JSON.parse(localStorage.getItem('reccord_recent') || '[]');
    document.getElementById('commitCount').textContent = String(recent.length);
    let html = '';
    for (let i = 0; i < 128; i++) {
      html += '<span class="' + (i < recent.length ? 'on' : '') + '"></span>';
    }
    grid.innerHTML = html;

    const list = document.getElementById('recentList');
    if (recent.length) {
      list.innerHTML = recent.slice(0, 8).map(r => `
        <div class="card">
          <strong>${r.name}</strong>
          <p style="margin:0.25rem 0 0;font-size:0.8rem;color:#94a3b8;">${new Date(r.at).toLocaleString()}</p>
        </div>`).join('');
    }
  </script>
</body>
</html>
