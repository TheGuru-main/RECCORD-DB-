<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workspace — RECCORD DB</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .grid-shell {
      border-radius: 16px;
      padding: 10px;
      border: 1px solid rgba(196,164,132,0.4);
      background:
        linear-gradient(135deg, rgba(74,14,28,0.85), rgba(167,124,82,0.35)),
        linear-gradient(347deg, #4a0e1c 0%, #6b1e2a 45%, #a67c52 100%);
      box-shadow: 0 8px 28px rgba(0,0,0,0.35);
      overflow: hidden;
    }
    .grid-brand {
      text-align: center;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      margin: 0 0 0.65rem;
      padding: 0.35rem 0.5rem;
      border-radius: 999px;
      color: #fff7f0;
      background: linear-gradient(90deg, #6b1e2a, #c4a484, #f59e0b, #6b1e2a);
      background-size: 220% 100%;
      animation: brand-slide 6s linear infinite;
    }
    @keyframes brand-slide {
      0% { background-position: 0% 50%; }
      100% { background-position: 220% 50%; }
    }
    .grid-scroll {
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
    }
    .full-grid {
      display: grid;
      grid-template-columns: repeat(64, minmax(7px, 1fr));
      gap: 3px;
      width: max(100%, 520px);
      min-width: 100%;
      padding: 6px;
      border-radius: 12px;
      background: rgba(10,4,8,0.55);
    }
    @media (min-width: 480px) {
      .full-grid {
        grid-template-columns: repeat(64, minmax(8px, 1fr));
        gap: 4px;
        width: max(100%, 640px);
      }
    }
    @media (min-width: 768px) {
      .full-grid {
        grid-template-columns: repeat(64, minmax(10px, 1fr));
        gap: 5px;
        width: 100%;
      }
    }
    .full-grid button {
      width: 100%;
      aspect-ratio: 1;
      min-width: 7px;
      border: none;
      padding: 0;
      border-radius: 2px;
      background: rgba(60, 20, 35, 0.55);
    }
    .full-grid button.filled {
      cursor: pointer;
      background: linear-gradient(135deg, #f59e0b, #ef4444, #e879f9);
      background-size: 180% 180%;
      animation: cell-glow 4s ease infinite;
      box-shadow: 0 0 6px rgba(251,191,36,0.5);
    }
    @keyframes cell-glow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .desc-box {
      margin-top: 0.35rem;
      padding: 0.55rem 0.65rem;
      border-radius: 8px;
      background: rgba(0,0,0,0.25);
      font-size: 0.85rem;
      opacity: 0.95;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <button class="menu-btn" onclick="openDrawer()"><i class="fa fa-bars"></i></button>
    <span class="title">Workspace</span>
    <span class="user-label" id="headerName">—</span>
  </header>
  <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
  <aside class="side-drawer" id="sideDrawer">
    <a href="/pages/home.html" class="active">Workspace</a>
    <a href="/pages/org-dashboard.html" id="drawerDash" style="display:none;">Dashboard</a>
    <a href="/pages/lookup.html">Lookup</a>
    <a href="/pages/records.html">Records</a>
    <a href="/pages/profile.html">Profile</a>
    <a href="/pages/workers.html" id="drawerWorkers" style="display:none;">Workers</a>
    <a href="#" onclick="logout()" style="color:#fecaca;">Logout</a>
  </aside>

  <div class="page with-chrome">
    <p id="welcomeText">Welcome</p>

    <a class="btn primary" id="orgDashBtn" href="/pages/org-dashboard.html" style="display:none;margin-bottom:1rem;">Dashboard</a>

    <div class="section-title" style="margin-top:0.5rem;">64 × 54 Wizard grid (rows × cols)</div>

    <div class="grid-shell">
      <p class="grid-brand">powered by GuruInnovations🌀</p>
      <div class="grid-scroll">
        <div class="full-grid" id="grid"></div>
      </div>
    </div>
    <p id="gridMeta" style="font-size:0.8rem;opacity:0.75;margin-top:0.4rem;"></p>

    <div class="section-title">Records</div>
    <div id="recentList"></div>
    <p class="err" id="error"></p>
  </div>

  <a href="/pages/commit.html" class="fab"><i class="fa fa-plus"></i></a>
  <nav class="bottom-nav">
    <a href="/pages/home.html" class="active"><i class="fa fa-home"></i>Home</a>
    <a href="/pages/lookup.html"><i class="fa fa-search"></i>Lookup</a>
    <a href="/pages/messages.html"><i class="fa fa-comments"></i>Messages</a>
    <a href="/pages/records.html"><i class="fa fa-folder-open"></i>Records</a>
    <a href="/pages/profile.html"><i class="fa fa-user"></i>Me</a>
  </nav>

  <script src="/js/api.js"></script>
  <script src="/js/shell.js"></script>
  <script>
    if (typeof requireAuth === "function" && !requireAuth()) throw new Error("auth");
    const name = typeof getDisplayName === "function" ? getDisplayName() : "User";
    document.getElementById("headerName").textContent = name;
    document.getElementById("welcomeText").textContent = "Welcome, " + name;

    if ((localStorage.getItem("reccord_account_type") || "") === "organisation") {
      var b = document.getElementById("orgDashBtn");
      if (b) b.style.display = "block";
      var d = document.getElementById("drawerDash");
      if (d) d.style.display = "block";
      var w = document.getElementById("drawerWorkers");
      if (w) w.style.display = "block";
    }

    function escapeHtml(s) {
      return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    async function loadGrid() {
      const grid = document.getElementById("grid");
      const metaEl = document.getElementById("gridMeta");
      const listEl = document.getElementById("recentList");
      try {
        const meta = await GridAPI.getMine();
        const rows = meta.rows || 64;
        const cols = meta.cols || 54;
        const cells = meta.cells || {};
        const total = rows * cols;
        window.__cells = cells;

        let html = "";
        for (let i = 0; i < total; i++) {
          const cell = cells[String(i)];
          if (cell) {
            html += '<button type="button" class="filled" title="' +
              escapeHtml(cell.object_name || "") +
              '" onclick="openCell(' + i + ')"></button>';
          } else {
            html += '<button type="button" disabled></button>';
          }
        }
        grid.innerHTML = html;
        metaEl.textContent = rows + "×" + cols + " · " + (meta.storage || "");

        const placements = meta.placements || [];
        listEl.innerHTML = placements.length
          ? placements.map(function (p) {
              const desc = p.description || "";
              return (
                '<div class="card" style="cursor:pointer;" onclick="openByObject(\'' +
                escapeHtml(p.object_id) + '\',\'' + escapeHtml(p.object_name) + '\',\'' +
                escapeHtml(desc).replace(/'/g, "&#39;") + '\')">' +
                "<strong>" + escapeHtml(p.object_name) + "</strong>" +
                (desc
                  ? '<div class="desc-box">' + escapeHtml(desc) + "</div>"
                  : "") +
                "</div>"
              );
            }).join("")
          : '<div class="card"><p style="margin:0;opacity:0.85;">No placements yet.</p></div>';
      } catch (e) {
        document.getElementById("error").textContent = e.message;
      }
    }

    function openCell(i) {
      const cell = (window.__cells || {})[String(i)];
      if (!cell) return;
      sessionStorage.setItem("detail_placement", JSON.stringify(cell));
      if (cell.object_id) sessionStorage.setItem("detail_object_id", cell.object_id);
      window.location.href = "/pages/commit-detail.html";
    }
    function openByObject(id, name, desc) {
      sessionStorage.setItem("detail_placement", JSON.stringify({
        object_id: id, object_name: name, description: desc
      }));
      sessionStorage.setItem("detail_object_id", id);
      window.location.href = "/pages/commit-detail.html";
    }
    loadGrid();
  </script>
</body>
</html>
