<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Records — RECCORD DB</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .desc-box {
      margin-top: 0.35rem; padding: 0.55rem 0.65rem; border-radius: 8px;
      background: rgba(0,0,0,0.25); font-size: 0.85rem; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <button class="menu-btn" onclick="openDrawer()"><i class="fa fa-bars"></i></button>
    <span class="title">Records</span>
    <span class="user-label" id="headerName"></span>
  </header>
  <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
  <aside class="side-drawer" id="sideDrawer">
    <a href="/pages/home.html">Workspace</a>
    <a href="/pages/lookup.html">Lookup</a>
    <a href="/pages/records.html" class="active">Records</a>
    <a href="/pages/profile.html">Profile</a>
    <a href="/pages/org-dashboard.html" id="dashLink" style="display:none;">Dashboard</a>
    <a href="/pages/workers.html" id="workersLink" style="display:none;">Workers</a>
    <a href="#" onclick="logout()" style="color:#fecaca;">Logout</a>
  </aside>

  <div class="page with-chrome">
    <p id="scopeNote" style="font-size:0.9rem;opacity:0.85;"></p>
    <div id="list"><p style="opacity:0.8;">Loading…</p></div>
    <p class="err" id="error"></p>
  </div>

  <nav class="bottom-nav">
    <a href="/pages/home.html"><i class="fa fa-home"></i>Home</a>
    <a href="/pages/lookup.html"><i class="fa fa-search"></i>Lookup</a>
    <a href="/pages/messages.html"><i class="fa fa-comments"></i>Messages</a>
    <a href="/pages/records.html" class="active"><i class="fa fa-folder-open"></i>Records</a>
    <a href="/pages/profile.html"><i class="fa fa-user"></i>Me</a>
  </nav>

  <script src="/js/api.js"></script>
  <script src="/js/shell.js"></script>
  <script>
    if (!requireAuth()) throw new Error("auth");
    document.getElementById("headerName").textContent = getDisplayName();
    const type = localStorage.getItem("reccord_account_type") || "";
    if (type === "organisation") {
      document.getElementById("dashLink").style.display = "block";
      document.getElementById("workersLink").style.display = "block";
    }
    document.getElementById("scopeNote").textContent =
      type === "organisation"
        ? "Organisation tenant placements (your org grid)"
        : type === "worker"
        ? "Organisation tenant placements (worker scope)"
        : "Your personal tenant placements";

    function escapeHtml(s) {
      return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    async function load() {
      const list = document.getElementById("list");
      const err = document.getElementById("error");
      try {
        const meta = await GridAPI.getMine();
        const placements = meta.placements || [];
        if (!placements.length) {
          list.innerHTML = '<div class="card"><p style="margin:0;opacity:0.85;">No records yet. Commit from Home.</p></div>';
          return;
        }
        list.innerHTML = placements.map(function (p) {
          const desc = p.description || "";
          return (
            '<div class="card" style="cursor:pointer;" onclick="openRec(\'' +
            escapeHtml(p.object_id) + '\',\'' + escapeHtml(p.object_name) + '\')">' +
            "<strong>" + escapeHtml(p.object_name) + "</strong>" +
            (desc ? '<div class="desc-box">' + escapeHtml(desc) + "</div>" : "") +
            '<p style="margin:0.35rem 0 0;font-size:0.8rem;opacity:0.75;">' +
            (p.created_at ? new Date(p.created_at).toLocaleString() : "") +
            "</p></div>"
          );
        }).join("");
      } catch (e) {
        list.innerHTML = "";
        err.textContent = e.message;
      }
    }

    function openRec(id, name) {
      sessionStorage.setItem("detail_object_id", id);
      sessionStorage.setItem("detail_placement", JSON.stringify({ object_id: id, object_name: name }));
      window.location.href = "/pages/commit-detail.html";
    }
    load();
  </script>
</body>
</html>
