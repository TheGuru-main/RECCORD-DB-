<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — RECCORD DB</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="page">
    <a class="back-link" href="/pages/landing.html">← Back</a>
    <h2>Log in</h2>
    <p>Use the credentials for your RECCORD account (Regular, Organisation, or Worker).</p>

    <label>Username or phone</label>
    <input type="text" id="identifier" placeholder="Username or +234…" autocomplete="username" />

    <label>Password</label>
    <input type="password" id="password" placeholder="Password" autocomplete="current-password" />

    <button class="btn primary" id="btn" onclick="doLogin()">Log in</button>
    <p class="err" id="error"></p>
  </div>
  <script src="/js/api.js"></script>
  <script>
    async function doLogin() {
      const identifier = document.getElementById("identifier").value;
      const password = document.getElementById("password").value;
      const err = document.getElementById("error");
      const btn = document.getElementById("btn");
      err.textContent = "";
      btn.disabled = true;
      btn.textContent = "Signing in…";
      try {
        const data = await AuthAPI.loginAny(identifier, password);
        saveSession(data);
        window.location.href = "/pages/home.html";
      } catch (e) {
        err.textContent = e.message;
        btn.disabled = false;
        btn.textContent = "Log in";
      }
    }
  </script>
</body>
</html>
