<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — RECCORD DB</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="page">
    <a class="back-link" href="/pages/landing.html">← Back</a>
    <h2>Log in</h2>
    <p>Use your phone number and password.</p>
    <label>Phone *</label>
    <input id="identifier" type="tel" placeholder="+234…" />
    <label>Password *</label>
    <input id="password" type="password" />
    <button class="btn primary" id="btn" onclick="doLogin()">Log in</button>
    <p class="err" id="error"></p>
  </div>
  <script src="/js/api.js"></script>
  <script>
    async function doLogin() {
      const phone = document.getElementById("identifier").value.trim();
      const password = document.getElementById("password").value;
      const err = document.getElementById("error");
      const btn = document.getElementById("btn");
      err.textContent = "";
      btn.disabled = true;
      try {
        let data;
        try {
          data = await AuthAPI.regularLogin({ phone: phone, password: password });
        } catch (e1) {
          try {
            data = await AuthAPI.organisationLogin({ phone: phone, password: password });
          } catch (e2) {
            data = await AuthAPI.workerLogin({ worker_phone: phone, worker_password: password });
          }
        }
        saveSession(data);
        window.location.href = "/pages/home.html";
      } catch (e) {
        err.textContent = e.message;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
