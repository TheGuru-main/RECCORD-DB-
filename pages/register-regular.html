<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Regular signup — RECCORD DB</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="page">
    <a class="back-link" href="/pages/landing.html">← Back</a>
    <h2>Regular User</h2>
    <p>Phone is your identity (uID).</p>
    <label>Full name *</label>
    <input id="name" />
    <label>Phone *</label>
    <input id="phone" type="tel" placeholder="+234…" />
    <label>Password *</label>
    <input id="password" type="password" />
    <button class="btn primary" id="btn" onclick="submit()">Create account</button>
    <p class="err" id="error"></p>
  </div>
  <script src="/js/api.js"></script>
  <script>
    async function submit() {
      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;
      const err = document.getElementById("error");
      const btn = document.getElementById("btn");
      err.textContent = "";
      if (!name || !phone || !password) { err.textContent = "All fields required"; return; }
      btn.disabled = true;
      try {
        const data = await AuthAPI.regularSignup({ name, phone, password });
        saveSession(data);
        window.location.href = "/pages/home.html";
      } catch (e) {
        err.textContent = e.message;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
