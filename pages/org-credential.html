<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worker Credential — RECCORD DB</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="page">
    <h2>Save your Worker Credential</h2>
    <p>Shown once. Share with staff so they can join as workers.</p>
    <div class="card">
      <p id="cred" style="word-break:break-all;margin:0;color:#fff7f0;"></p>
    </div>
    <button class="btn clay" onclick="copyCred()">Copy</button>
    <a class="btn primary" href="/pages/home.html">Continue to Workspace</a>
  </div>
  <script>
    const c = sessionStorage.getItem("just_worker_credential") || localStorage.getItem("reccord_worker_credential") || "";
    document.getElementById("cred").textContent = c || "(No credential in session — check Profile later)";
    function copyCred() {
      if (!c) return;
      navigator.clipboard.writeText(c).catch(function () {});
      alert("Copied");
    }
  </script>
</body>
</html>
